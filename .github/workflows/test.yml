name: Offline regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node skills/maimen-calendar/scripts/test.mjs
      - run: node skills/maimen-meal/scripts/test.mjs
      - run: node skills/maimen-meal/scripts/integration.test.mjs
